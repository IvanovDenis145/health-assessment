spring:
  config:
    import: classpath:health-norms.yml
  application:
    name: health-assessment-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/health_assessment_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate      # Hibernate не создаёт таблицы — это делает Flyway
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

logging:
  level:
    root: INFO
    ru.ulstu.health: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/health-assessment.log

app:
  jwt:
    # Секретный ключ (в реальном проекте хранится в переменных окружения)
    secret: "super_secret_health_assessment_key_for_jwt_token_2026_ulstu"
    # Время жизни токена в миллисекундах (24 часа)
    expiration-milliseconds: 86400000