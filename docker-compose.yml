version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: health-db
    environment:
      POSTGRES_DB: health_assessment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: