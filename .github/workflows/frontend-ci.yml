name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests with coverage
        run: npm run coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

      - name: Build
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      # --- НОВОЕ: E2E ТЕСТЫ (PLAYWRIGHT) ---
      # ВНИМАНИЕ: Для работы E2E в CI нужно поднять сервера.
      # Если вы используете docker-compose в корне проекта, раскомментируйте шаг ниже:

      # - name: Start backend and frontend
      #   working-directory: . # возвращаемся в корень
      #   run: docker-compose up -d

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run E2E Tests
        run: npx playwright test
        # Если поднимали докер, добавьте:
        # env:
        #   BASE_URL: http://localhost:5173

      - name: Upload Playwright Report
        if: always() # Загружаем отчет, даже если тесты упали
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/