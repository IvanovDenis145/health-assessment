name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    # По умолчанию все команды запускаются в папке frontend
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- 1. ПОДНИМАЕМ БАЗУ ДАННЫХ ---
      - name: Start PostgreSQL Database
        working-directory: . # Возвращаемся в корень, где лежит docker-compose.yml
        run: docker compose up -d

      # --- 2. НАСТРАИВАЕМ JAVA ДЛЯ БЭКЕНДА ---
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        working-directory: . # Возвращаемся в корень
        run: chmod +x backend/gradlew
      # ---------------------------------------

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests with coverage
        run: npm run coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

      - name: Build
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      # --- 3. E2E ТЕСТЫ (PLAYWRIGHT) ---
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run E2E Tests
        run: npx playwright test
        # Playwright сам запустит backend и frontend (см. playwright.config.ts)

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/

      # --- 4. ОСТАНОВКА БАЗЫ ДАННЫХ (опционально) ---
      - name: Stop PostgreSQL
        if: always()
        working-directory: .
        run: docker compose down